<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda de Visitas | R&D PRIME</title><link rel="stylesheet" href="/css/style.css"><style>
body{background:#0b0d14;color:#f4f1e9}.wrap{max-width:1450px;margin:auto;padding:26px 20px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #55452d;padding-bottom:18px}.muted{color:#aeb1bb}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{background:#1b202b;color:#eee;border:1px solid #55452d;border-radius:8px;padding:10px 13px;cursor:pointer;text-decoration:none}button.gold{background:#c99a48;color:#17130b;font-weight:bold}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}.filters input{max-width:190px}input,textarea,select{background:#0d1018;color:#eee;border:1px solid #45434a;border-radius:7px;padding:10px;box-sizing:border-box;width:100%}.calendar{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:9px;overflow-x:auto}.day{background:#121722;border:1px solid #3c3428;border-radius:10px;min-height:210px;padding:10px}.day.today{border-color:#c99a48}.day h3{font-size:13px;margin:2px 0 12px}.event{background:#202633;border-left:3px solid #c99a48;padding:9px;margin:7px 0;border-radius:6px;font-size:12px;cursor:pointer}.event small{display:block;color:#b8bac2;margin-top:4px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:18px}.visit{background:#151b27;border:1px solid #3b3429;border-radius:10px;padding:13px}.visit h3{font-size:15px;margin:0 0 6px}.visit p{font-size:12px;color:#b8bac2;margin:5px 0}.visit select{margin-top:8px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.dialog{background:#171c27;border:1px solid #675333;border-radius:14px;padding:20px;width:min(650px,100%);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:5px;font-size:13px;color:#bbb}.wide{grid-column:1/-1}.feedback{color:#e2b96e;min-height:22px}@media(max-width:650px){.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">R&D PRIME IMÓVEIS · COMERCIAL</div><h1>Agenda de Visitas</h1><div id="who" class="muted">Validando acesso…</div></div><div class="actions"><a class="btn" href="/painel.html">Painel</a><a class="btn" href="/crm.html">CRM</a><button id="new" class="gold">+ Agendar visita</button><button id="logout">Sair</button></div></header><div class="filters"><button id="prev">←</button><input id="anchor" type="date"><button id="next">→</button><button id="today">Hoje</button><button id="week" class="gold">Semana</button><button id="day">Dia</button><span id="feedback" class="feedback"></span></div><section id="calendar" class="calendar"></section><h2>Visitas no período</h2><section id="items" class="list"></section></main>
<div id="modal" class="modal"><section class="dialog"><div class="actions" style="justify-content:space-between"><h2>Agendar visita</h2><button id="close">Fechar ✕</button></div><form id="form" class="form"><label>Nome do cliente *<input id="name" required maxlength="120"></label><label>Telefone *<input id="phone" required maxlength="40"></label><label>E-mail<input id="email" type="email"></label><label>Imóvel / código<input id="property" maxlength="128"></label><label>Data e horário *<input id="start" type="datetime-local" required></label><label>Tipo<select id="type"><option>Presencial</option><option>Vídeochamada</option></select></label><label class="wide">Observações<textarea id="notes" rows="3"></textarea></label><label>Status<select id="status"><option value="confirmada">Confirmada</option><option value="realizada">Realizada</option><option value="cliente_faltou">Cliente Faltou</option><option value="proposta_apresentada">Proposta Apresentada</option></select></label><div class="wide"><button class="gold">Salvar visita</button></div></form><div id="modal-feedback" class="feedback"></div></section></div>
<script type="module">
import{auth}from"/js/firebase-client.js";import{onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const $=s=>document.querySelector(s),labels={confirmada:"Confirmada",realizada:"Realizada",cliente_faltou:"Cliente Faltou",proposta_apresentada:"Proposta Apresentada"};let user,items=[],mode="week",anchor=new Date();const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),parse=s=>new Date(s.length===10?s+"T12:00:00":s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,o={}){let token=await user.getIdToken(),r=await fetch(url,{...o,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erro "+r.status);return d}
function startOfWeek(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function range(){let a=mode==="week"?startOfWeek(anchor):new Date(anchor);a.setHours(0,0,0,0);let b=new Date(a);b.setDate(b.getDate()+(mode==="week"?7:1));return[a,b]}
function when(v){let d=parse(v);return Number.isNaN(d.getTime())?"Horário a confirmar":d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}
function filtered(){let[a,b]=range();return items.filter(v=>{let d=parse(v.inicio);return !Number.isNaN(d.getTime())&&d>=a&&d<b}).sort((x,y)=>parse(x.inicio)-parse(y.inicio))}
function render(){let[a,b]=range(),list=filtered(),days=[];for(let d=new Date(a);d<b;d.setDate(d.getDate()+1))days.push(new Date(d));$("#calendar").innerHTML=days.map(d=>{let ds=ymd(d),events=list.filter(v=>String(v.inicio).slice(0,10)===ds);return'<section class="day '+(ds===ymd(new Date())?'today':'')+'"><h3>'+d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"})+'</h3>'+(events.length?events.map(v=>'<article class="event" data-id="'+esc(v.id)+'"><b>'+esc(v.clienteNome)+'</b><small>'+esc(v.inicio?.length>10?parse(v.inicio).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):(v.turno||"Horário a confirmar"))+' · '+esc(v.imovelId||"Imóvel não informado")+'</small><small>'+esc(labels[v.status]||v.status)+'</small></article>').join(""):'<small class="muted">Sem visitas</small>')+'</section>'}).join("");$("#items").innerHTML=list.map(v=>'<article class="visit"><h3>'+esc(v.clienteNome)+'</h3><p>'+esc(when(v.inicio))+' · '+esc(v.tipo||"Visita")+'</p><p>'+esc(v.clienteTelefone)+' · '+esc(v.imovelId||"Imóvel não informado")+'</p><p>Origem: '+esc(v.origem||"site")+'</p><select data-status="'+esc(v.id)+'">'+Object.entries(labels).map(([k,l])=>'<option value="'+k+'" '+(v.status===k?'selected':'')+'>'+l+'</option>').join("")+'</select></article>').join("")||'<p class="muted">Nenhuma visita neste período.</p>';document.querySelectorAll("[data-status]").forEach(el=>el.onchange=async()=>{try{await api("/api/agenda/visitas/"+encodeURIComponent(el.dataset.status),{method:"PATCH",body:JSON.stringify({status:el.value})});await load()}catch(e){$("#feedback").textContent=e.message}});$("#anchor").value=ymd(anchor)}
async function load(){try{items=(await api("/api/agenda/visitas")).items||[];render();$("#feedback").textContent=items.length+" visitas carregadas."}catch(e){$("#feedback").textContent=e.message}}
$("#new").onclick=()=>{$("#form").reset();let d=new Date();d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);$("#start").value=ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes());$("#modal-feedback").textContent="";$("#modal").classList.add("open")};$("#close").onclick=()=>$("#modal").classList.remove("open");$("#form").onsubmit=async e=>{e.preventDefault();let b={clienteNome:$("#name").value.trim(),clienteTelefone:$("#phone").value.trim(),clienteEmail:$("#email").value.trim(),imovelId:$("#property").value.trim(),inicio:$("#start").value,tipo:$("#type").value,observacoes:$("#notes").value,status:$("#status").value};try{await api("/api/agenda/visitas",{method:"POST",body:JSON.stringify(b)});$("#modal").classList.remove("open");anchor=parse(b.inicio);await load()}catch(x){$("#modal-feedback").textContent=x.message}};
$("#prev").onclick=()=>{anchor.setDate(anchor.getDate()-(mode==="week"?7:1));render()};$("#next").onclick=()=>{anchor.setDate(anchor.getDate()+(mode==="week"?7:1));render()};$("#today").onclick=()=>{anchor=new Date();render()};$("#week").onclick=()=>{mode="week";render()};$("#day").onclick=()=>{mode="day";render()};$("#anchor").onchange=()=>{anchor=parse($("#anchor").value);render()};$("#logout").onclick=async()=>{await signOut(auth);location.replace("/login.html")};
onAuthStateChanged(auth,async u=>{user=u;if(!u){location.replace("/login.html");return}try{let p=(await api("/api/auth/perfil")).perfil;if(!p||p.ativo!==true||p.status!=="ativo"||!["administrador","corretor"].includes(p.papel))throw Error("Acesso somente a corretores e administradores ativos.");$("#who").textContent=(p.nome||u.email)+" · "+p.papel;await load()}catch(e){$("#feedback").textContent=e.message}});
</script></body></html>
