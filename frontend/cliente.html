<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Área do Cliente | R&D PRIME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/admin.css"> <!-- Reaproveitando painéis -->
</head>
<body>

  <div class="bg-aura" aria-hidden="true">
    <div class="aura aura-1"></div>
    <div class="aura aura-2"></div>
    <div class="aura aura-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div style="position: fixed; top: 20px; left: 20px; z-index: 100;">
    <a href="/painel.html" class="button button-dark" style="padding: 8px 16px; font-size: 13px;">← Voltar ao Hub</a>
  </div>

  <main class="dashboard-wrap" style="padding-top: 80px; max-width: 1200px;">
    <header class="dash-top">
      <div>
        <div class="eyebrow">ÁREA DO CLIENTE</div>
        <div class="dash-title">Meus Favoritos</div>
        <p id="client-welcome" class="dash-subtitle">Carregando seus dados…</p>
      </div>
      <div class="dash-actions">
        <button class="button button-gold" id="btn-whatsapp-favoritos" type="button" disabled>
          Enviar lista para um corretor ↗
        </button>
        <button class="button button-dark" id="btn-logout" type="button">Sair</button>
      </div>
    </header>

    <div id="wishlist-alert" class="notice" style="display:none; background: rgba(230, 180, 90, 0.1); border-color: rgba(230,180,90,0.3); color: var(--gold-2);"></div>

    <!-- Onde os cards serão renderizados -->
    <div id="wishlist-grid" class="property-grid">
      <div class="empty-state loading-skeleton" style="grid-column: 1/-1; background:transparent; border:none;">
        <div class="skeleton-card" style="height: 300px;"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/cliente.js"></script>
</body>
</html>
