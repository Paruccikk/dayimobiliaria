
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solicitar acesso | R&D PRIME</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="/">
        <span class="brand-mark">R&D</span>
        <span>
          <span class="brand-name">R&D PRIME</span>
          <span class="brand-sub">ÁREA PROFISSIONAL</span>
        </span>
      </a>
      <a href="/login.html">Já tenho acesso</a>
    </div>
  </header>

  <main class="section section-soft">
    <div class="container" style="max-width:540px">
      <div class="panel">
        <div class="eyebrow">Área profissional</div>
        <h2>Solicitar cadastro</h2>
        <p class="property-location">
          Preencha seus dados para solicitar acesso à plataforma
          R&D PRIME IMÓVEIS.
        </p>

        <form id="cadastro-form">
          <div class="field">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" autocomplete="name"
                   maxlength="120" required>
          </div>

          <div class="field" style="margin-top:15px">
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel"
                   autocomplete="tel" maxlength="30" required>
          </div>

          <div class="field" style="margin-top:15px">
            <label for="email">E-mail profissional</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required>
          </div>

          <div class="field" style="margin-top:15px">
            <label for="password">Senha (mínimo de 6 caracteres)</label>
            <input id="password" name="password" type="password"
                   autocomplete="new-password" minlength="6" required>
          </div>

          <div class="field" style="margin-top:15px">
            <label for="confirm-password">Confirmar senha</label>
            <input id="confirm-password" name="confirm-password"
                   type="password" autocomplete="new-password"
                   minlength="6" required>
          </div>

          <button class="button button-dark"
                  style="width:100%;margin-top:20px"
                  type="submit">
            Enviar solicitação
          </button>

          <p id="cadastro-feedback"
             class="property-location"
             role="status" aria-live="polite"></p>
        </form>

        <div class="notice">
          Todo cadastro começa como cliente e fica pendente de aprovação.
          Depois, o administrador poderá aprovar o acesso e alterar o perfil.
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/cadastro.js"></script>
</body>
</html>
