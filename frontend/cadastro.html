<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05060a">
  <title>Cadastre-se | DAY IMOBILIÁRIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .auth-consent-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm, 10px);
      padding: 14px;
      margin-top: 6px;
    }
    .auth-consent-label {
      display: flex !important;
      align-items: flex-start !important;
      gap: 12px;
      cursor: pointer;
      text-transform: none !important;
      letter-spacing: normal !important;
      font-family: inherit !important;
      font-size: 13px !important;
      line-height: 1.5;
      color: var(--text-soft, #a0aec0) !important;
      margin: 0 !important;
    }
    .auth-consent-label input[type="checkbox"] {
      width: 18px !important;
      height: 18px !important;
      margin-top: 2px !important;
      flex: none;
      accent-color: var(--gold-2, #c9a45c);
      cursor: pointer;
    }
    .auth-consent-label span b {
      color: var(--text, #fff);
    }
  </style>
</head>
<body>
  <div class="bg-aura" aria-hidden="true">
    <div class="aura aura-1"></div>
    <div class="aura aura-2"></div>
    <div class="aura aura-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <section class="auth-card reveal visible" style="position:relative; z-index:1; max-width:480px;">
    <div class="eyebrow">DAY IMOBILIÁRIA</div>
    <h1>Criar conta</h1>
    <p class="dash-subtitle">Cadastre-se para acompanhar imóveis e receber oportunidades exclusivas.</p>

    <form id="cadastro-form" class="auth-fields">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" autocomplete="name" maxlength="120" placeholder="Seu nome e sobrenome" required>

      <label for="celular">WhatsApp</label>
      <input id="celular" name="celular" type="tel" autocomplete="tel" maxlength="20" placeholder="(11) 99999-9999" required>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="Mínimo de 6 caracteres" required>

      <label for="confirm-password">Confirmar senha</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" placeholder="Digite a senha novamente" required>

      <div class="auth-consent-box">
        <label for="consentimento-privacidade" class="auth-consent-label">
          <input id="consentimento-privacidade" type="checkbox" required>
          <span>Li e concordo com as <b>Políticas de Privacidade</b>.</span>
        </label>
        <p style="margin:12px 0; font-size:13px; line-height:1.5; color:var(--text-soft, #a0aec0);">
          As autorizações de alertas abaixo são opcionais e independentes. Você pode escolher uma, algumas ou nenhuma.
        </p>
        <label for="consentimento-whatsapp" class="auth-consent-label">
          <input id="consentimento-whatsapp" type="checkbox">
          <span><b>Autorizo receber alertas pelo WhatsApp</b> no número informado no cadastro. Posso cancelar essa autorização quando quiser.</span>
        </label>
        <label for="consentimento-email" class="auth-consent-label" style="margin-top:12px !important;">
          <input id="consentimento-email" type="checkbox">
          <span><b>Autorizo receber alertas por e-mail</b> no endereço informado no cadastro. Posso cancelar essa autorização quando quiser.</span>
        </label>
        <label for="consentimento-localizacao" class="auth-consent-label" style="margin-top:12px !important;">
          <input id="consentimento-localizacao" type="checkbox">
          <span><b>Autorizo o uso da minha localização</b> para calcular a proximidade de imóveis e enviar alertas da região. A localização expira em até 90 dias e posso retirar a autorização.</span>
        </label>
      </div>

      <button class="button button-gold" id="btn-submit" type="submit" style="margin-top:10px; width:100%;">Criar minha conta</button>
    </form>

    <p class="auth-register-link" style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-soft);">
      Já possui cadastro? <a href="/login.html" style="color:var(--gold-2); font-weight:600;">Entrar</a>
    </p>

    <p id="cadastro-feedback" class="dash-feedback" style="text-align:center; color:#f06ca8;" role="status" aria-live="polite"></p>

    <div style="display:flex; justify-content:center; align-items:center; margin-top:20px;">
      <a href="/" style="font-size:13px; color:var(--text-soft);">← Voltar ao site</a>
    </div>
  </section>

  <script type="module" src="/js/cadastro.js"></script>

</body>
</html>
