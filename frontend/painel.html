<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meu Painel | R&D PRIME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/painel.css">
</head>
<body>

  <div class="bg-aura" aria-hidden="true">
    <div class="aura aura-1"></div>
    <div class="aura aura-2"></div>
    <div class="aura aura-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a class="brand" href="/">
        <span class="brand-mark">R&D</span>
        <span class="brand-text">
          <span class="brand-name">R&D PRIME</span>
          <span class="brand-sub">ÁREA RESTRITA</span>
        </span>
      </a>
      <div style="display:flex; gap:16px; align-items:center;">
        <span id="user-email" style="font-size:13px; color:var(--text-soft);">Carregando…</span>
        <button id="btn-logout" class="button button-outline" style="padding: 8px 16px; font-size: 13px;">Sair</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 80px 0; min-height: 70vh;">
    <div class="reveal visible" style="text-align:center; margin-bottom: 60px;">
      <div class="eyebrow"><span class="eyebrow-line"></span>Bem-vindo(a)</div>
      <h1 style="font-family:var(--font-display); font-size:3rem; margin-bottom:16px;">Para onde deseja ir?</h1>
      <p class="section-intro" style="margin: 0 auto;">Selecione o painel de acordo com o seu nível de acesso.</p>
    </div>

    <div class="hub-grid" id="hub-grid">
      <a href="/gerencia.html" id="manager-panel-card" class="hub-card" hidden style="border:2px solid rgba(215,173,101,.8);box-shadow:0 12px 36px rgba(215,173,101,.16);">
        <div class="hub-icon" style="background:rgba(215,173,101,.14);color:#d7ad65;border-color:rgba(215,173,101,.45);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        </div>
        <h2>Painel do Gerente</h2>
        <p>Acompanhe sua equipe, produtividade dos corretores, imóveis, leads e visitas.</p>
        <div class="hub-action">ACESSAR PAINEL DE GERÊNCIA <span>↗</span></div>
      </a>

      <!-- Os cartões serão injetados pelo JS -->
      <div class="empty-state loading-skeleton" style="grid-column: 1/-1; background:transparent; border:none;">
        <div class="skeleton-card" style="height: 200px;"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/painel-hub.js"></script>
</body>
</html>
