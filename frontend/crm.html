<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | R&D PRIME</title><link rel="stylesheet" href="/css/style.css"><style>
body{background:#0b0d14;color:#f4f1e9}.crm{max-width:1600px;margin:auto;padding:28px 20px}.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid #58462b;padding-bottom:20px}.head h1{margin:8px 0}.muted{color:#aaa}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{background:#1b202b;color:#eee;border:1px solid #55452d;border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none}button.gold{background:#c99a48;color:#17130b;font-weight:bold}.toolbar{margin:16px 0}.toolbar input,input,textarea,select{background:#0d1018;color:#eee;border:1px solid #45434a;border-radius:7px;padding:10px;box-sizing:border-box;width:100%}.toolbar input{max-width:400px}.board{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:12px;overflow-x:auto;padding:12px 0}.col{background:#121722;border:1px solid #3c3428;border-radius:12px;padding:12px;min-height:280px}.col h2{font-size:14px;display:flex;justify-content:space-between}.lead{background:#202633;border-radius:9px;padding:12px;margin:9px 0;cursor:pointer}.lead:hover{outline:1px solid #c99a48}.lead small{display:block;color:#aaa;margin-top:5px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{background:#171c27;border:1px solid #675333;border-radius:14px;padding:20px;width:min(680px,100%);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:5px;color:#bbb;font-size:13px}.wide{grid-column:1/-1}.history{background:#0c111a;padding:10px;border-radius:8px;margin:7px 0;font-size:13px}.feedback{color:#e2b96e;min-height:22px}@media(max-width:650px){.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="crm"><header class="head"><div><div class="eyebrow">R&D PRIME IMÓVEIS · OPERAÇÃO COMERCIAL</div><h1>CRM de Leads</h1><div id="who" class="muted">Validando acesso…</div></div><div class="actions"><a class="btn" href="/painel.html">Painel</a><button id="add" class="gold">+ Novo lead</button><button id="reload">Atualizar ↻</button><button id="logout">Sair</button></div></header><div class="toolbar"><input id="search" placeholder="Buscar nome, telefone ou imóvel…"><span id="feedback" class="feedback"></span></div><section id="board" class="board"></section></main>
<div id="modal" class="modal"><section class="dialog"><div class="actions" style="justify-content:space-between"><h2>Ficha do Lead</h2><button id="close">Fechar ✕</button></div><form id="form" class="form"><input id="id" type="hidden"><label>Nome *<input id="nome" required></label><label>Telefone *<input id="telefone" required></label><label>E-mail<input id="email" type="email"></label><label>Imóvel / código<input id="imovel"></label><label class="wide">Preferências do cliente<textarea id="preferencias" rows="3" placeholder="Ex.: apê de 2 dorms na Vila Sônia até R$ 500 mil, vaga coberta."></textarea></label><label class="wide">Observações<textarea id="mensagem" rows="2"></textarea></label><label>Etapa<select id="status"></select></label><label>Próximo contato<input id="proximo" type="date"></label><div class="wide"><button class="gold">Salvar ficha</button></div></form><hr><h3>Histórico de interações</h3><div id="history"></div><form id="interaction" class="form"><label class="wide">Nova interação<textarea id="note" rows="2" required placeholder="Ligação, WhatsApp, retorno…"></textarea></label><div class="wide"><button>Adicionar interação</button></div></form><div id="modal-feedback" class="feedback"></div></section></div>
<script type="module" src="/js/crm.js"></script></body></html>
