<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05060a">
  <title>Trabalhe conosco | R&D Prime Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .career-wrap{width:min(760px,92%);margin:70px auto}
    .career-hero,.career-form{padding:clamp(25px,5vw,48px);border:1px solid var(--border-strong);border-radius:24px;background:rgba(14,16,25,.82);box-shadow:var(--shadow-card)}
    .career-hero{margin-bottom:24px}.career-hero h1{font:700 clamp(2rem,5vw,3.2rem)/1.1 var(--font-display);margin:12px 0}
    .career-hero p,.career-form>p{color:var(--text-soft);line-height:1.8}
    .career-form{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .career-form h2,.career-form>p,.career-form .full{grid-column:1/-1}
    .career-form h2{margin:0;font:600 1.8rem var(--font-display)}
    .career-form label{display:block;color:var(--text-soft);font-size:12px;margin-bottom:7px}
    .career-form input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border-strong);background:#fff;color:#17221c;font:inherit}
    .career-form input::placeholder{color:#6d7771}
    .career-form button{border:0;cursor:pointer;min-width:190px}
    .career-feedback{min-height:22px;color:var(--gold-2)}
    @media(max-width:650px){.career-form{grid-template-columns:1fr}.career-form h2,.career-form>p,.career-form .full{grid-column:auto}}
  </style>
</head>
<body>
  <div class="bg-aura" aria-hidden="true"><div class="aura aura-1"></div><div class="aura aura-2"></div><div class="aura aura-3"></div><div class="grid-overlay"></div></div>
  <header class="navbar"><div class="container nav-inner"><a class="brand" href="/"><span class="brand-mark">R&D</span><span class="brand-text"><span class="brand-name">R&D PRIME</span><span class="brand-sub">IMÓVEIS</span></span></a><a class="button button-outline" href="/">Voltar ao site</a></div></header>
  <main class="career-wrap">
    <section class="career-hero">
      <div class="eyebrow"><span class="eyebrow-line"></span>Oportunidade profissional</div>
      <h1>Venha fazer parte da <span class="grad-text">R&D Prime.</span></h1>
      <p>Quer trabalhar com a gente? Deixe seu nome e telefone. Nossa equipe entrará em contato para conversar sobre as oportunidades.</p>
    </section>
    <form id="career-form" class="career-form">
      <h2>Deixe seu contato</h2>
      <p>Preencha somente os dois campos abaixo. É rápido e simples.</p>
      <div><label for="nome">Nome completo *</label><input id="nome" name="nome" type="text" maxlength="120" autocomplete="name" placeholder="Seu nome completo" required></div>
      <div><label for="telefone">Telefone / WhatsApp *</label><input id="telefone" name="telefone" type="tel" maxlength="40" autocomplete="tel" placeholder="(11) 99999-9999" required></div>
      <div class="full"><button class="button button-gold" type="submit">Enviar contato</button><p id="career-feedback" class="career-feedback" role="status" aria-live="polite"></p></div>
    </form>
  </main>
  <script type="module" src="/js/trabalhe-conosco.js"></script>
</body></html>
